# Wöchentliche Tiefen-Prüfungen (TESTPLAN 2.3 + Phase 4): AddressSanitizer-
# und Checked-Lauf der E2E-/Grenzwert-Suite. Bewusst nicht Teil des
# Push-Gates (Laufzeit); Cron + manuell auslösbar. Kein Dogfood-Checkout
# nötig — beide Targets bauen nur examples-unabhängige Suiten.

name: deep-checks

on:
  schedule:
    - cron: "17 4 * * 1" # montags 04:17 UTC
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [asan, checked]
    steps:
      - uses: actions/checkout@v5

      - name: System-Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libgc-dev libsqlite3-dev sqlite3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
