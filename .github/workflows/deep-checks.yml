# Wöchentliche Tiefen-Prüfungen (TESTPLAN 2.3 + Phase 4): AddressSanitizer-
# und Checked-Lauf der E2E-/Grenzwert-Suite, plus die libFuzzer-Harnesses
# in fuzz/*/ (issue #111, see fuzz/README.md) gegen ihren Seed-Corpus.
# Bewusst nicht Teil des Push-Gates (Laufzeit); Cron + manuell auslösbar.
# Kein Dogfood-Checkout nötig — alle drei Targets bauen nur
# examples-unabhängige Suiten. `make fuzz` braucht keine eigene
# Sonderbehandlung hier: sein FUZZ_SECONDS?=60-Default pro Target läuft
# problemlos unter dem generischen `make ${{ matrix.target }}`-Schritt
# unten mit, genau wie asan/checked.

name: deep-checks

on:
  schedule:
    - cron: "17 4 * * 1" # montags 04:17 UTC
  workflow_dispatch:

# Bug 108: same least-privilege default applied to check.yml -- this
# workflow only checks out and builds/tests the repo itself, never writes.
permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [asan, checked, fuzz]
    steps:
      - uses: actions/checkout@v5

      - name: System-Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libgc-dev libsqlite3-dev sqlite3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
